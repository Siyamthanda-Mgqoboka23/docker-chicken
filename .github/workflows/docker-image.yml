name: Advanced CI/CD Integration Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # JOB 1: Validates code layout, syntax formatting, and compilation rules early
  code-quality:
    name: 🛡️ Code Quality & Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      # FIX: Executable steps that use the configured cache layout to validate syntax stability
      - name: Verify Code Formatting
        run: dotnet format --verify-no-changes --severity warn

      - name: Static Code Analysis
        run: dotnet build --configuration Release /warnaserror

  # JOB 2: Compiles the source files inside target Docker configurations
  compile-and-build:
    name: 🐳 Docker Build & Package
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Build Application Containers
        run: docker compose build

  # JOB 3: Spins up container layout and evaluates cross-dependency integrations
  integration-testing:
    name: 🧪 System Integration Verification
    runs-on: ubuntu-latest
    needs: compile-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Build and Launch Application Mesh
        run: docker compose up --build -d

      - name: Grace Period for Database Boot
        run: |
          echo "Giving Microsoft SQL Server 25 seconds to complete table setups..."
          sleep 25

      - name: Wait for API Readiness
        run: |
          echo "Waiting for ChickenAPI to wake up at http://localhost:5231..."
          timeout 60s sh -c 'until curl -sSf http://localhost:5231/GetMeEggs > /dev/null; do sleep 2; done'
          echo "ChickenAPI is up and running!"

      - name: Integration Step 1 - Seed Data via API
        run: |
          echo "Posting a new chicken payload to the database..."
          curl -X POST http://localhost:5231/api/Chicken \
            -H "Content-Type: application/json" \
            -d '{"name": "Cluck Norris", "breed": "Rhode Island Red"}' \
            --fail --verbose

      - name: Integration Step 2 - Verify Front-End MVC Data Rendering
        run: |
          echo "Querying the MVC web application on port 5178..."
          MVC_RESPONSE=$(curl -s http://localhost:5178)

          echo "Asserting that the MVC response contains the expected chicken name..."
          if echo "$MVC_RESPONSE" | grep -q "Cluck Norris"; then
            echo "Success: MVC interface successfully rendered the expected chicken!"
          else
            echo "Error: MVC interface failed to render the expected chicken."
            exit 1
          fi

      - name: Tear Down Application Mesh and Logs
        if: always()
        run: |
          docker compose logs chickenapi > api-container-debug.log
          docker compose logs chicken-db-service > db-container-debug.log
          docker compose logs chickenmvc > mvc-container-debug.log
          docker compose down --volumes
                

           